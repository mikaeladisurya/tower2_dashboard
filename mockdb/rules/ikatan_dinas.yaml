# ---------------------------------------------------------------------------
# 2. ANGKA KUMULATIF REALISASI RIIL (bukan kuota nominal) -- PENEMUAN PENTING
# ---------------------------------------------------------------------------
realisasi_kumulatif_d3_2018:
  sumber: "PLN, siaran pers 31 Agustus 2018 -- 'Pelepasan Mahasiswa Program D3 Kelas Kerjasama PLN-UGM'"
  kutipan_verbatim: >
    "Sejak tahun 2013 sampai dengan saat ini Program D3 Kerjasama PLN telah diikuti
    sebanyak 1.673 orang mahasiswa. 159 orang telah lulus dan diangkat pegawai. 186 orang
    telah lulus dan sedang mengikuti Diklat Prajabatan serta 1.328 sedang menjalani kuliah
    tingkat I, II dan III."
  implikasi: >
    Kumulatif 2013-2018 (~3 angkatan lulus): cuma 159+186=345 orang total pernah sampai
    tahap pegawai/prajabatan. Rata-rata ~100-140/tahun -- JAUH di bawah taksiran kuota
    nominal (PTN x kelas x mahasiswa bisa >300/tahun). Realisasi riil selalu di bawah
    kuota, pola yang sama terlihat di ITPLN (kuota 150 -> realisasi 147/135/109).
  peringatan: >
    Angka ini snapshot Agustus 2018, mencakup cohort intake ~2013-2015 (institusi PTN
    lebih sedikit dari era matang 2016-2019). Cohort yang relevan untuk 2020/2021
    (intake 2017-2019, 15-17 PTN) KEMUNGKINAN lebih besar dari rata-rata historis ini --
    tidak ada data langsung untuk memverifikasi seberapa besar.

# ---------------------------------------------------------------------------
# 3. TAKSIRAN MANUAL YANG DIPAKAI DI kohort.yaml (keputusan user 2026-08-18)
# ---------------------------------------------------------------------------
# Formula: jumlah PTN x kelas/PTN x mahasiswa/kelas. SEMUA angka di bawah MANUAL,
# ditentukan langsung oleh user setelah melihat linimasa & realisasi_kumulatif di atas.
# Dipakai sebagai isian `komposisi_jalur` di kohort.yaml, BUKAN sebagai finding baru.

taksiran_dipakai:
  - target_tahun_program: 2020
    sumber_cohort: "D3 intake 2017"
    formula: "15 PTN x 1 kelas x ~13-15 mhs"
    hasil: 200
    keyakinan: rendah
    catatan: "13 dari 15 PTN untuk intake 2017 TIDAK terverifikasi individual (lihat linimasa)."

  - target_tahun_program: 2021
    sumber_cohort: "D3 intake 2018"
    formula: "17 PTN x 1 kelas x ~20 mhs"
    hasil: 340
    keyakinan: rendah

  - target_tahun_program: 2021
    sumber_cohort: "D3 intake 2019"
    formula: "15 PTN x 1 kelas x ~20 mhs"
    hasil: 300
    keyakinan: rendah

  - target_tahun_program: 2024
    sumber_cohort: "D4 intake 2019 (perdana & satu-satunya)"
    formula: "5 PTN x 2 kelas x ~30 mhs"
    hasil: 300
    keyakinan: rendah

  - target_tahun_program: 2024
    sumber_cohort: "ITPLN S1 -- DITARIK 2026-08-18"
    formula: "n/a"
    hasil: 0
    keyakinan: n/a
    catatan: >
      Sempat diusulkan pakai ulang angka kontrak 147 (ITPLN 2023) sebagai taksiran
      lulusan 2024, tapi user membatalkan: 147 itu kontrak MASUK KULIAH mahasiswa baru
      2023 (program S1 4 tahun, lulus ~2027), bukan lulusan 2024 -- salah tafsir.
      Residu 2024 dibiarkan berlubang (`tidak_diketahui`) sampai ada info lebih baik.
