# ikatan_dinas.yaml — linimasa program D3 Kelas Kerjasama / D4 & S1 Ikatan Dinas
# Rujukan: F-067(b) (hipotesis awal), sesi 2026-08-18 (verifikasi + keputusan user)
#
# TUJUAN FILE INI: dokumentasi linimasa program ikatan dinas/kelas kerjasama PLN dan
# taksiran headcount yang dipakai untuk mengisi `komposisi_jalur` di kohort.yaml pada
# tahun 2020, 2021, 2024 -- tahun-tahun di mana katalog gelombang publik TIDAK bisa
# menjelaskan seluruh kohort NYATA (lihat F-067).
#
# PERINGATAN SUMBER: linimasa & jumlah PTN di bawah berasal dari kombinasi (a) sumber
# PRIMER resmi (siaran pers PLN, halaman kampus, berita bertanggal -- ditandai per baris)
# dan (b) taksiran MANUAL user yang dibangun dari (a) dengan formula kasar
# "jumlah PTN x kelas/PTN x mahasiswa/kelas". (b) BUKAN angka bersumber -- jangan
# diperlakukan sebagai fakta, hanya sebagai isian residu yang lebih baik daripada nol.

meta:
  keyakinan_keseluruhan: rendah
  status: >
    Dipakai untuk mengisi SEBAGIAN residu 2020/2021/2024 di kohort.yaml, TIDAK untuk
    mengklaim closure penuh. Sisa yang tidak tertutup tetap `tidak_diketahui` secara
    eksplisit -- lihat komposisi_jalur di kohort.yaml.

# ---------------------------------------------------------------------------
# 1. LINIMASA TERVERIFIKASI (2016-2026) -- status per baris, bukan taksiran
# ---------------------------------------------------------------------------
# jenis verifikasi:
#   nyata_primer   = ada siaran pers PLN / halaman kampus resmi / berita bertanggal
#   nyata_parsial  = program terkonfirmasi jalan, tapi jumlah PTN/institusi tak lengkap
#   plausibel      = disebut berjalan oleh sumber sekunder, belum ada pengumuman spesifik
#   tidak_terjadi  = terkonfirmasi TIDAK ada intake baru tahun itu

linimasa:
