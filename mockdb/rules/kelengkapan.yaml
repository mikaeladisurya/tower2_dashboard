# kelengkapan.yaml — kelengkapan field bertahap per tahun kohort
# Rujukan: keputusan user, F-034, F-017, F-044, F-046
#
# GAGASANNYA: sistem rekrutmen tidak lahir lengkap. Field ditambahkan seiring waktu,
# jadi kohort lama punya kolom kosong yang TIDAK AKAN PERNAH terisi. Ini bukan cacat
# data mock -- ini persis keluhan yang bikin dashboard ini dibangun, dan harus terlihat.
#
# Aturan emas: JANGAN mengisi mundur. Kolom yang belum ada di 2019 harus NULL di 2019,
# bukan diisi nilai wajar. Dashboard harus bisa menunjukkan "sejak kapan kita punya data ini".

meta:
  versi: 2
  status_sumber: DIMODELKAN
  catatan_sumber: >
    Tidak ada sumber yang memberi tahu kapan tiap field ditambahkan ke sistem PLN.
    Skema F-034 hanya menunjukkan bentuk form SEKARANG (2026). Kurva pengisian di bawah
    adalah pemodelan, tapi ARAHNYA (makin baru makin lengkap) berjangkar ke F-044 & F-048
    yang menandai 2019-2021 sebagai periode berkualitas rendah.
  perubahan_v2: "Kolom 2019 ditambahkan mengikuti perluasan horison."

# ---------------------------------------------------------------------------
# 1. KURVA PENGISIAN PER BLOK FIELD
# ---------------------------------------------------------------------------
# Nilai = fraksi kandidat pada tahun program tsb yang field-nya TERISI.
# 0.00 berarti field-nya BELUM ADA di sistem, bukan sekadar jarang diisi.

blok:
  identitas_inti:
    field: [nama_lengkap, email, no_ktp, tempat_lahir, tanggal_lahir, jenis_kelamin, no_handphone]
    per_tahun: {2019: 1.00, 2020: 1.00, 2021: 1.00, 2022: 1.00, 2023: 1.00, 2024: 1.00, 2025: 1.00, 2026: 1.00}
    catatan: "Selalu wajib. Tanpa ini akun tidak bisa dibuat."

  agama_status:
    field: [agama, status_perkawinan]
    per_tahun: {2019: 0.97, 2020: 0.98, 2021: 0.98, 2022: 1.00, 2023: 1.00, 2024: 1.00, 2025: 1.00, 2026: 1.00}

  alamat_domisili:
    field: [alamat_domisili, kota_domisili, propinsi_domisili, kode_pos_domisili]
    per_tahun: {2019: 0.90, 2020: 0.92, 2021: 0.94, 2022: 0.97, 2023: 0.99, 2024: 1.00, 2025: 1.00, 2026: 1.00}

  alamat_asal:
    field: [alamat_asal, kota_asal, propinsi_asal]
    per_tahun: {2019: 0.00, 2020: 0.00, 2021: 0.00, 2022: 0.35, 2023: 0.78, 2024: 0.93, 2025: 0.99, 2026: 1.00}
    catatan: >
      Pemisahan domisili vs asal (F-034) diperkenalkan belakangan. Sebelum itu hanya ada
      satu alamat. Ini pemodelan yang berkonsekuensi nyata: analisis "dari provinsi mana
      pelamar berasal" MUSTAHIL untuk kohort 2020-2021, dan dashboard harus mengatakannya
      terang-terangan, bukan menampilkan grafik yang diam-diam bias.

  fisik_dasar:
    field: [ukuran_baju, ukuran_celana, ukuran_sepatu, body_height, body_weight, bmi]
    per_tahun: {2019: 0.00, 2020: 0.00, 2021: 0.00, 2022: 0.15, 2023: 0.45, 2024: 0.70, 2025: 0.92, 2026: 0.98}
    catatan: "Blok yang dimaksud keputusan user 'kelengkapan bertahap'."

  fisik_lanjut:
    field: [visus_mata_kiri, visus_mata_kanan, tingkat_ketajaman, silinder, abdominal_circumference, tatto]
    per_tahun: {2019: 0.00, 2020: 0.00, 2021: 0.00, 2022: 0.00, 2023: 0.22, 2024: 0.55, 2025: 0.86, 2026: 0.96}
    catatan: >
      Visus & lingkar perut muncul paling akhir. Konsekuensinya: untuk kohort <=2022,
      hasil MCU tidak bisa dijelaskan oleh data biodata -- yang justru realistis, karena
      itulah keadaan sesungguhnya di banyak sistem HR.

  kontak_keluarga:
    field: [hubungan_keluarga, alamat_keluarga, no_telp_keluarga, pekerjaan_keluarga]
    per_tahun: {2019: 0.25, 2020: 0.30, 2021: 0.35, 2022: 0.62, 2023: 0.80, 2024: 0.90, 2025: 0.96, 2026: 0.98}

  pendidikan_dasar:
    field: [pendidikan_sd, pendidikan_smp, pendidikan_sma_smk]
    per_tahun: {2019: 0.15, 2020: 0.20, 2021: 0.25, 2022: 0.55, 2023: 0.88, 2024: 0.98, 2025: 1.00, 2026: 1.00}
    catatan: >
      F-034: validasi sistem MEWAJIBKAN SD/SMP/SMA diisi. Kewajiban itu jelas ditambahkan
      belakangan -- kohort lama banyak yang cuma punya baris pendidikan tinggi.

  pendidikan_tinggi:
    field: [degree, universitas, program_studi, ipk, tahun_masuk, tahun_lulus]
    per_tahun: {2019: 0.99, 2020: 0.99, 2021: 0.99, 2022: 1.00, 2023: 1.00, 2024: 1.00, 2025: 1.00, 2026: 1.00}
    catatan: "Selalu ada -- IPK dipakai menyaring administrasi sejak awal."

  sertifikasi:
    field: [kategori_sertifikasi, tahun_sertifikasi, skor_sertifikasi]
    per_tahun: {2019: 0.06, 2020: 0.08, 2021: 0.10, 2022: 0.18, 2023: 0.24, 2024: 0.28, 2025: 0.31, 2026: 0.33}
    catatan: "Opsional sejak awal -- angkanya rendah karena memang tidak wajib, bukan karena field-nya belum ada."

  berkas_foto:
    field: [swafoto, foto_full_body, pasfoto]
    per_tahun: {2019: 0.00, 2020: 0.00, 2021: 0.00, 2022: 0.40, 2023: 0.85, 2024: 0.97, 2025: 1.00, 2026: 1.00}
    catatan: "Swafoto & foto full body (F-034) berkaitan dengan verifikasi identitas jarak jauh -- wajar muncul pasca-pandemi."

  berkas_dokumen:
    field: [ktp_scan, akta_kelahiran, skbm, ijazah, transkrip]
    per_tahun: {2019: 0.85, 2020: 0.88, 2021: 0.90, 2022: 0.95, 2023: 0.98, 2024: 1.00, 2025: 1.00, 2026: 1.00}

# ---------------------------------------------------------------------------
# 2. FIELD YANG TIDAK PERNAH ADA DI SISTEM ASLI
# ---------------------------------------------------------------------------
# Ini berbeda sifatnya dari blok di atas. Bukan "belum ada lalu ada", tapi "tidak
# pernah ada sampai hari ini". Nilainya tetap dibangkitkan supaya dashboard bisa
# mendemokan seperti apa jadinya KALAU data ini dikumpulkan -- itulah gunanya.
tidak_ada_di_sistem_asli:
  daftar:
    - field: [skor_tes_mentah]
      tahap: [adaptif, akademik_inggris, psikologi, wawancara]
      rujukan: "F-017 -- sistem hanya menyimpan lulus/gagal"
      perlakuan: "dibangkitkan, ditandai sumber_sistem = DIMODELKAN"
    - field: [passing_grade]
      rujukan: "F-028 -- tidak ada di perdir 0056/0050/0048"
      perlakuan: "dibangkitkan, ditandai sumber_sistem = DIMODELKAN"
    - field: [kuota_per_posisi, unit_peminta, kompetensi_diminta]
      rujukan: "F-017 (domain HST, bukan HTD), F-027 (brosur tidak memuat kuota), F-043"
      perlakuan: "dibangkitkan, ditandai sumber_sistem = DIMODELKAN"
  aturan_tampilan: >
    Dashboard WAJIB memberi penanda visual pada setiap angka yang berasal dari kolom
    DIMODELKAN. Kalau tidak, seluruh nilai proyek ini hilang: orang akan mengira PLN
    sudah punya data yang sebenarnya belum ada.

# ---------------------------------------------------------------------------
# 3. KELENGKAPAN PER JALUR
# ---------------------------------------------------------------------------
per_jalur:
  mandiri:
    catatan: "Lengkap sesuai kurva di atas."
  rbb:
    catatan: >
      Kandidat RBB punya JEJAK LEBIH SEDIKIT di sistem PLN, karena tahap 1-3 dikerjakan
      FHCI (F-046). Ini bukan simulasi kelengkapan -- ini ketiadaan struktural.
    field_kosong_permanen:
      - tanggal_daftar_asli        # ada di FHCI, tidak diserahkan
      - hasil_administrasi         # dikerjakan FHCI
      - skor_tkd_akhlak_twk        # dikerjakan FHCI
      - skor_inggris               # dikerjakan FHCI (tes online 2)
      - berkas_unggahan            # diunggah ke portal FHCI
    pengali_kelengkapan_biodata: 0.75
    catatan_pengali: >
      Biodata kandidat RBB diisi ulang di sistem PLN saat serah-terima, sering terburu-buru
      dan tidak selengkap pendaftar mandiri. Pengali ini diterapkan ke kurva di bagian 1.
    rujukan: "F-046, HANDOFF butir 1"

# ---------------------------------------------------------------------------
# 4. PENANDA KUALITAS PER KOHORT
# ---------------------------------------------------------------------------
kualitas_kohort:
  2019: {label: RENDAH,  alasan: "Sistem paling awal. Blok fisik, alamat asal, dan foto belum ada. Judul programnya pun hanya pulih lewat arsip Wayback -- tidak satu pun ada di katalog live."}
  2020: {label: RENDAH,  alasan: "Tahun COVID + jalur PPB. Satu-satunya gelombang adalah PPB BUMN Papua (buka 30 Des), jadi tahap awal dikerjakan FHCI dan tidak ada jejaknya di PLN."}
  2021: {label: RENDAH,  alasan: "Jalur PPB nasional -- tidak ada satu pun judul program di katalog maupun arsip. Data per-kandidat tahap awal ada di FHCI, bukan PLN."}
  2022: {label: SEDANG,  alasan: "Blok fisik mulai muncul tapi baru terisi sebagian kecil."}
  2023: {label: BAIK,    alasan: "Sebagian besar blok sudah aktif."}
  2024: {label: SEDANG,  alasan: "Kelengkapan sistem bagus, tapi jalur RBB membuat tahap awal kosong."}
  2025: {label: BAIK,    alasan: "Paling lengkap di antara kohort yang sudah selesai."}
  2026: {label: PERENCANAAN, alasan: "Belum ada gelombang yang dibuka. Yang ada baru proyeksi kekosongan, usulan kebutuhan, dan pagu -- semuanya DIMODELKAN kecuali gap FTK yang nyata."}
  aturan: >
    Label ini WAJIB ikut ke tabel fakta sebagai kolom, bukan cuma catatan di dokumen.
    Dashboard memakainya untuk memberi peringatan saat pengguna membandingkan antar tahun.
