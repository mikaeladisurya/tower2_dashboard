  - kode: VEND08
    nama: "Daya Dimensi Indonesia (DDI)"
    tipe_layanan: psikologi
    kota_basis: nasional
    status_sumber: DIMODELKAN
    catatan: "assessment center nasional real, mewakili vendor psikotes yg melayani banyak kota_terkunci sekaligus"

  - kode: VEND09
    nama: "UPAC PLN (Corporate University)"
    tipe_layanan: psikologi
