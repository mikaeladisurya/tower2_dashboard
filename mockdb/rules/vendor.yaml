catatan_penunjukan: >
  Langkah 07 hanya membangun MASTER vendor (bukan penugasan per-tahap-per-kandidat --
  itu langkah 09). Aturan penugasan sementara: kota_terkunci yang sama dgn kota_basis
  vendor tipe sesuai tahap dapat vendor itu; kota lain dapat vendor tipe sesuai dgn
  kota_basis == nasional (VEND08 psikologi, VEND09 psikologi cadangan; fisik_mcu tanpa
  cadangan nasional eksplisit -- kota_terkunci di luar 6 kota vendor pakai vendor
  fisik_mcu terdekat berdasarkan pulau, ditandai DIMODELKAN di langkah 09).
